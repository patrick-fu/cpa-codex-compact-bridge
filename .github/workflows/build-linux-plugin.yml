name: Build Linux Plugin

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-integration:
    name: Test and build linux/amd64 plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout pinned CLIProxyAPI
        # v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: router-for-me/CLIProxyAPI
          ref: 2e6b1d83f6c304a102aa33c1faf0a4f94d0d331e # v7.2.125
          path: cpa

      - name: Set up Go
        # v6.5.0
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: |
            plugin/go.sum
            integration/go.sum

      - name: Unit test
        working-directory: plugin
        run: go test ./...

      - name: Vet
        working-directory: plugin
        run: go vet ./...

      - name: Build c-shared ABI library
        working-directory: plugin
        run: |
          VERSION="0.1.2-rc.${GITHUB_SHA::7}"
          mkdir -p ../dist/linux-amd64
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildmode=c-shared \
              -ldflags "-X main.pluginVersion=$VERSION" \
              -o ../dist/linux-amd64/cpa-codex-compact-bridge.so .
          file ../dist/linux-amd64/cpa-codex-compact-bridge.so
          strings ../dist/linux-amd64/cpa-codex-compact-bridge.so | grep -F "$VERSION"
          (
            cd ../dist/linux-amd64
            sha256sum cpa-codex-compact-bridge.so > cpa-codex-compact-bridge.so.sha256
          )

      - name: Integration gate against pinned CLIProxyAPI
        working-directory: integration
        env:
          CPA_SOURCE_DIR: ${{ github.workspace }}/cpa
        run: go test ./...

      - name: Upload test-only linux/amd64 candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpa-codex-compact-bridge-linux-amd64-${{ github.sha }}
          path: |
            dist/linux-amd64/cpa-codex-compact-bridge.so
            dist/linux-amd64/cpa-codex-compact-bridge.so.sha256
          if-no-files-found: error
          retention-days: 7

      # The project is source-first: the workflow artifact is an ephemeral
      # test candidate, not a published release.
